<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Email Responder</title>
    </head>
    <body>
        <label for="emailInput">Paste the email you received.</label>
        <textarea id="emailInput"></textarea>
        <label for="toneSelect">Select the tone of the response.</label>
        <select id="toneSelect">
            <option value="professional">Professional</option>
            <option value="friendly">Friendly</option>
            <option value="concise">Concise</option>
        </select>
        <button>Generate reply</button>
        <div id="output">

        </div>
    </body>
</html>
