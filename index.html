<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Email Responder</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav>
            <h1>Email Responder 1.0</h1>
            <div class="nav-links">
                <a href="/">Enter API key</a>
                |
                <a href="/">About</a>
            </div>
        </nav>
        <div class="page">
            <div class="container">
                <label for="emailInput">Paste the email you received.</label>
                <textarea id="emailInput"></textarea>
                <label for="toneSelect">Select the tone of the response.</label>
                <select id="toneSelect">
                    <option value="professional">Professional</option>
                    <option value="friendly">Friendly</option>
                    <option value="concise">Concise</option>
                </select>
                <button id="button" onclick="generateReply()">Generate reply</button>
            </div>
            <div id="output" class="output">

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
